[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negconj"
version = "0.1.0"
description = "U.S. Code corpus studies: negated connectives (C2 on constituency trees) and 1225(b)(2)(A)-shaped sentences (dependency query)"
requires-python = ">=3.12"
dependencies = [
    "modal==1.6.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "stanza==1.15.0",
    "transformers==5.20.2",
    "nltk==3.10.3",
    "tqdm==4.70.1",
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["negconj", "barbosa"]

[tool.setuptools.package-data]
negconj = ["assets/*"]
barbosa = ["dashboard_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "barbosa/tests"]
pythonpath = [".", "tests"]
